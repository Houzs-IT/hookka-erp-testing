# Board Report pre-build (owner 2026-11-10: the first open of a month was slow).
#
# 00:30 Malaysia time (16:30 UTC) every day: build and keep the LAST CLOSED
# month's Board Report if it is not kept yet. On the 1st of a month this builds
# the month that just closed, so the first open is instant; on other days it
# finds the report already kept and does nothing.
#
# Owner 2026-11-17 asked for the report to renew itself on the 1st, 7th, 10th and
# 15th. A build started from here does not finish (BUG-2026-11-17-531: inside the
# request it hits the Worker's resource limit; in the background it never lands),
# so the renewal happens on the FIRST OPEN after each of those days instead
# (GET /api/reports/board, boardKeptIsStale). This job stays a best-effort
# pre-build: a timeout is a warning, not a failure — the first open builds it.
#
# Manual run: Actions › Board Report pre-build › Run workflow (optional month
# YYYY-MM, tick "force" to rebuild a kept month).
# Uses the same CRON_SECRET repo secret as rebuild-dashboard-snapshot.yml.
name: Board Report pre-build (daily)

on:
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Month to build (YYYY-MM) — empty = last closed month'
        required: false
        default: ''
      force:
        description: 'Rebuild even if already kept'
        type: boolean
        required: false
        default: false

jobs:
  prebuild:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/internal/board-report-prebuild
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MONTH: ${{ github.event.inputs.month }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is empty. See refresh-mvs.yml header for setup."
            exit 1
          fi
          data=$(jq -nc --arg m "$MONTH" --arg f "$FORCE" '{} + (if $m != "" then {month:$m} else {} end) + (if $f == "true" then {force:true} else {} end)')
          url='https://hookka-erp-testing.pages.dev/api/internal/board-report-prebuild'
          post() {
            curl --silent --show-error --write-out '\nHTTP_STATUS:%{http_code}' --max-time 120 \
              --request POST --header "Content-Type: application/json" \
              --header "x-cron-secret: $CRON_SECRET" --data "$1" "$url"
          }
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          response=$(post "$data")
          status=$(echo "$response" | tail -n1 | sed 's/HTTP_STATUS://')
          body=$(echo "$response" | sed '$d')
          echo "Status: $status"
          echo "Body: $(printf '%s' "$body" | jq -rc '{ok, month, built, building, note, elapsedMs, error}' 2>/dev/null || echo "<${#body} bytes, not JSON>")"
          if [ "$status" = "200" ]; then exit 0; fi
          if [ "$status" != "202" ]; then
            echo "::error::Board Report pre-build failed with status $status"
            exit 1
          fi
          # 202 = the build carries on in the background (like Refresh on the
          # page). Poll until the kept copy is newer than this run's start.
          month=$(printf '%s' "$body" | jq -r '.month')
          check=$(jq -nc --arg m "$month" '{month:$m, check:true}')
          for i in $(seq 1 18); do
            sleep 20
            got=$(post "$check" | sed '$d')
            gen=$(printf '%s' "$got" | jq -r '.generatedAt // ""' 2>/dev/null)
            echo "Check $i: $(printf '%s' "$got" | jq -rc '{generatedAt, building}' 2>/dev/null || echo '<not JSON>')"
            if [ -n "$gen" ] && [ "$gen" \> "$started" ]; then
              echo "Built: $gen"
              exit 0
            fi
          done
          echo "::warning::Board Report build for $month did not finish within 6 minutes; the first open of the report builds it"
          exit 0
