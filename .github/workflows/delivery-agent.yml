name: Delivery Agent — Daily Run

# Fires the Delivery Agent's full daily cycle at 07:30 MYT (23:30 UTC prev
# day), right after the 07:00 Production Morning Brief:
#   proposals (LOAD_PLAN / INVOICE_GAP / POD_CHASE)
#   → transit-drift learning (may file cs.transitDays.* config proposals)
#   → Claude AI focus paragraph
#   → brief snapshot (shown on Delivery → Delivery Agent tab).
#
# Auth: x-cron-secret header, same CRON_SECRET contract as daily-reports.yml.
# The endpoint self-skips (ok:true, skipped:"paused") when the DELIVERY agent
# or the global kill switch is paused in the Agent Console.

on:
  schedule:
    - cron: '30 23 * * *'  # 07:30 MYT next day
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: POST run-trigger
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is empty"
            exit 1
          fi
          url="https://erp.hookka.com/api/internal/delivery-agent/run-trigger"
          echo "--- Firing Delivery Agent → $url"
          response=$(curl --silent --show-error --write-out '\nHTTP_STATUS:%{http_code}' \
            --max-time 120 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "x-cron-secret: $CRON_SECRET" \
            --data '{}' \
            "$url" || true)
          status=$(echo "$response" | tail -n1 | sed 's/HTTP_STATUS://')
          body=$(echo "$response" | sed '$d')
          echo "Status: $status"
          # The repo is PUBLIC: print only the shape and counts of the reply, never its
          # figures, document numbers or rows (filter: scripts/ci/log-safe-body.jq).
          echo "Body (counts only): $(printf '%s' "$body" | jq -rc 'if type == "object" then [to_entries[] | .key as $k | .value as $v | ($v | type) as $t | "\($k)=" + (if $t == "array" then "\($v | length) items" elif $t == "object" then "{\($v | length) keys}" elif $t == "boolean" or $t == "null" then ($v | tostring) elif $t == "number" and ($k | test("count|processed|skipped|failed|sent|created|updated|deleted|scanned|checked|posted|rebuilt|attempted|replayed|remaining|pending|errors|ms$|^n[A-Z_]"; "i")) and (($k | test("Rm$|Sen$|_rm$|_sen$")) or ($k | test("amount|price|cost|value|balance|total"; "i")) | not) then ($v | tostring) else "<\($t)>" end)] | join(" ") elif type == "array" then "[\(length) items]" else "<\(type)>" end' 2>/dev/null || echo "<${#body} bytes, not JSON>")"
          if [ "$status" != "200" ]; then
            echo "::error::delivery-agent trigger failed with HTTP $status"
            exit 1
          fi
