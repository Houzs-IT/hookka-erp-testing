# ---------------------------------------------------------------------------
# Docs freshness gate
#
# Written 2026-08-13 after measuring the last 40 commits on main: 26 touched
# src/, and 11 of those (42%) shipped with no docs/ change. "Update-on-touch"
# had been written in CLAUDE.md for months — a convention nobody is stopped by
# is a wish, not a rule.
#
# The damage is not untidiness. README.md told every reader "Every API route
# trusts the caller" while the app had had auth since April; docs/API.md
# documented 4 of 136 endpoints; SYMBOLS.md's file:line index was 75% wrong.
# That is why the same question got three different answers depending on which
# source the reader happened to weight.
#
# This gate is deliberately easy to satisfy and impossible to skip SILENTLY:
# touch a doc, or write "[no-docs] <reason>" in a commit. The opt-out is a
# record, not a loophole — `git log --grep="\[no-docs\]"` should read as a list
# of decisions someone was willing to sign.
# ---------------------------------------------------------------------------
name: Docs freshness

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main]

jobs:
  docs-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history for the base..HEAD diff; a shallow clone makes the
          # pairing check silently compare against nothing and always pass.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stamp coverage — every doc says when it was last checked
        run: node scripts/check-docs-freshness.mjs --stamps

      - name: Pairing — a source change ships with a doc change or a recorded reason
        if: github.event_name == 'pull_request'
        run: |
          # checkout above already used fetch-depth: 0, so the base ref is
          # present. An extra `git fetch --depth=0` is not just redundant, it
          # is INVALID (git wants --unshallow) and exits 128 — which reads in
          # the UI as "the docs check failed" when nothing was ever checked.
          # A gate that fails for its own reasons teaches people to ignore it.
          git rev-parse --verify "origin/${{ github.base_ref }}" >/dev/null
          node scripts/check-docs-freshness.mjs --base "origin/${{ github.base_ref }}"

      # API.md belongs to main (2026-10-21). Its line numbers and date move with
      # almost every route change, so every branch that committed a regen
      # conflicted with every other one. A PR must not touch it (the pairing step
      # above fails one that does); main regenerates it after each merge, below.

      # The map is the one doc whose ERRORS are worse than its gaps. Nobody
      # reads 511k lines — ~6,000 A4 pages, 6-12 months to hold in your head —
      # so the map IS the mental model a new engineer starts from. A missing
      # entry makes them go look; a stale `file.ts:566` makes them confident and
      # wrong. Measured 2026-08-13 before this gate existed: 4 refs pointed at
      # code that had moved 18-149 lines, one named a test file
      # (`tests/scheduling.test.mjs`) that has never existed in this repo, and
      # 57% of recent src commits never touched the map at all.
      - name: CODEBASE-MAP points where it says it does
        run: node scripts/check-codebase-map.mjs

  # Regenerate docs/API.md on main after every merge and commit it back, the
  # same way refresh-bundle-baseline.yml keeps .bundle-baseline.json. A push
  # made with GITHUB_TOKEN does not trigger workflows, and [skip ci] is a second
  # guard, so this cannot loop.
  api-md:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: regen-api-md
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate API.md and commit it to main if it changed
        run: |
          node scripts/gen-api-docs.mjs
          if git diff --quiet -- docs/API.md; then
            echo "[api-md] up to date"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/API.md
          git commit -m "chore: auto-regen docs/API.md [skip ci]"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git fetch origin main || true
            git rebase origin/main || { git rebase --abort || true; break; }
          done
          echo "[api-md] could not push this run; the next push to main regenerates it"
